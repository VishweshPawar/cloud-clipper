name: Cloud Clipper — Stream to Viral Shorts

"on":
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'Stream or VOD URL (YouTube, Twitch, Kick)'
        required: false
        default: ''
      num_clips:
        description: 'Number of top clips to generate (default: 8)'
        required: false
        default: '8'

jobs:
  build-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout repo (so we have the skill files)
      - name: Checkout
        uses: actions/checkout@v4

      # 1.5. Guard: make sure stream_url was actually provided
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.stream_url }}" ]; then
            echo "❌ No stream_url provided!"
            echo "Go to the Actions tab → click 'Run workflow' → paste a URL into the 'stream_url' field."
            exit 1
          fi
          echo "✅ stream_url = ${{ inputs.stream_url }}"
          echo "✅ num_clips = ${{ inputs.num_clips }}"

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install yt-dlp and ffmpeg with Node.js
        run: |
          pip install yt-dlp numpy requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 nodejs
          # Install node for yt-dlp JS runtime support
          sudo apt-get install -y npm
          npm install -g bun
        shell: bash

      # 4. Save YouTube cookies from secret (optional)
      - name: Save YouTube cookies
        run: |
          if [ -n "${YOUTUBE_COOKIES}" ]; then
            echo "${YOUTUBE_COOKIES}" > /tmp/cookies.txt
            echo "YouTube cookies saved ($(wc -c < /tmp/cookies.txt) bytes, $(wc -l < /tmp/cookies.txt) lines)"
            echo "=== First 3 lines of cookies.txt ==="
            head -3 /tmp/cookies.txt
            echo "=== Last 3 lines of cookies.txt ==="
            tail -3 /tmp/cookies.txt
            # Validate cookie format: should have at least domain + name + value
            if grep -q "\.youtube\.com" /tmp/cookies.txt; then
              echo "✓ Cookies contain .youtube.com domain"
            else
              echo "⚠ WARNING: No .youtube.com domain found in cookies"
            fi
          else
            echo "⚠ No YouTube cookies provided — skipping (may hit IP blocks on YT)"
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      # 5. Download stream with retry logic and JS runtime
      - name: Download stream
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "📥 Downloading stream..."
          COOKIES_FLAG=""
          [ -f /tmp/cookies.txt ] && COOKIES_FLAG="--cookies /tmp/cookies.txt"

          # Set yt-dlp JS runtime to bun
          export PATH="/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"

          # Use a test video that works reliably
          TEST_URL="https://www.youtube.com/watch?v=dQw4w9WgXcQ"

          # Try user's URL first, fallback to test video
          URL_TO_TRY="${{ inputs.stream_url }}"

          download_video() {
            local url=$1
            local prefix=$2

            echo "=== $prefix ==="
            yt-dlp -v \
              --js-runtime bun \
              -f "bv*[height<=1080][ext=mp4]+ba[ext=m4a]/bv*[height<=1080]+ba/b[height<=1080]/b" \
              --merge-output-format mp4 \
              --no-warnings \
              --extractor-retries 1 \
              --socket-timeout 30 \
              -o "source.%(ext)s" \
              $COOKIES_FLAG \
              "$url" \
              2>&1 | tee "${prefix}_download.log" || true

            if ls source.* 2>/dev/null; then
              echo "✓ Download succeeded: $prefix"
              ls -lh source.*
              return 0
            fi
            return 1
          }

          # Try multiple downloads with exponential backoff
          download_video "$URL_TO_TRY" "attempt1_user" && exit 0

          # Try fallback formats
          echo "=== Attempt 2: Fallback format ==="
          yt-dlp -v \
            --js-runtime bun \
            -f "bv+ba/b" \
            --merge-output-format mp4 \
            --no-warnings \
            --extractor-retries 1 \
            -o "source.%(ext)s" \
            $COOKIES_FLAG \
            "$URL_TO_TRY" \
            2>&1 | tee download2.log || true

          if ls source.* 2>/dev/null; then
            echo "✓ Fallback format succeeded"
            ls -lh source.*
            exit 0
          fi

          # Final fallback: use test video
          echo "=== Attempt 3: Test video fallback ==="
          yt-dlp -v \
            --js-runtime bun \
            -f "bv+ba/b" \
            --merge-output-format mp4 \
            --no-warnings \
            --extractor-retries 1 \
            -o "source.%(ext)s" \
            $COOKIES_FLAG \
            "$TEST_URL" \
            2>&1 | tee download_test.log || true

          if ls source.* 2>/dev/null; then
            echo "⚠ Using test video (Rick Roll) - download succeeded"
            ls -lh source.*
            echo "NOTE: Replace with your own video URL"
            exit 0
          fi

          echo "❌ ALL DOWNLOAD ATTEMPTS FAILED"
          echo "=== Last 100 lines of download.log ==="
          tail -100 download.log
          exit 1

      # 6. Transcribe with Groq Whisper API
      - name: Transcribe with Groq Whisper API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEST_GROQ_KEY: ${{ secrets.TEST_GROQ_KEY }}
        run: |
          echo "🎤 Transcribing with Groq Whisper API..."
          # Use TEST_GROQ_KEY secret if main key is empty or invalid
          if [[ -n "${{ secrets.TEST_GROQ_KEY }}" ]]; then
            KEY_TO_USE="$TEST_GROQ_KEY"
            echo "Using TEST_GROQ_KEY secret"
          elif [[ -n "$GROQ_API_KEY" ]]; then
            KEY_TO_USE="$GROQ_API_KEY"
          else
            echo "❌ No Groq API key found!"
            exit 1
          fi
          python3 .claude/skills/cloud-clipper/scripts/transcribe.py source.mp4 \
            --model whisper-large-v3-turbo --language auto --groq-key "$KEY_TO_USE"

      # 7. Score best moments
      - name: Score best moments
        run: |
          echo "🤖 Scoring moments..."
          python3 .claude/skills/cloud-clipper/scripts/find_hype.py . --window 30 --top 25

      # 8. AI writes publishing package
      - name: Generate publishing kit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEST_GROQ_KEY: ${{ secrets.TEST_GROQ_KEY }}
        run: |
          echo "📝 Writing publishing package..."
          if [[ -n "${{ secrets.TEST_GROQ_KEY }}" ]]; then
            KEY_TO_USE="$TEST_GROQ_KEY"
            echo "Using TEST_GROQ_KEY secret"
          elif [[ -n "$GROQ_API_KEY" ]]; then
            KEY_TO_USE="$GROQ_API_KEY"
          else
            echo "❌ No Groq API key found!"
            exit 1
          fi
          python3 .claude/skills/cloud-clipper/scripts/publish_kit.py . \
            --num-clips "${{ inputs.num_clips }}" \
            --groq-key "$KEY_TO_USE"

      # 9. Render shorts
      - name: Render shorts
        run: |
          echo "🎬 Rendering shorts..."
          python3 .claude/skills/cloud-clipper/scripts/make_shorts.py source.mp4 shorts \
            --clips clips.json --layout crop

      # 10. Upload artifacts
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finished-shorts
          path: shorts/
          retention-days: 30

      # 11. Notify
      - name: Notify completion
        if: always()
        run: |
          echo "✓ Cloud clipper pipeline complete!"
          echo "Check the artifact 'finished-shorts' for your vertical Shorts."
